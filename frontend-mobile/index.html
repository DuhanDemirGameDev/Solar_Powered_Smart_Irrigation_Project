<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#080b0f">
    <title>Smart Irrigation Mobile</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="mobile-app">
        <main class="screen-stack" aria-live="polite">
            <section class="screen active" id="dashboardScreen" data-screen="dashboard">
                <header class="app-header">
                    <div>
                        <p>Smart Garden</p>
                        <h1>Moisture</h1>
                    </div>
                    <div class="live-pill" id="connectionStatus">
                        <span></span>
                        Live
                    </div>
                </header>

                <div class="gauge-wrap" aria-label="Current soil moisture">
                    <div class="gauge" id="moistureGauge">
                        <div class="gauge-core">
                            <span class="gauge-label">Soil</span>
                            <strong id="moistureValue">--</strong>
                            <span class="gauge-unit">Moisture %</span>
                        </div>
                    </div>
                </div>

                <div class="status-row">
                    <article>
                        <span>Pump</span>
                        <strong id="pumpState">--</strong>
                    </article>
                    <article>
                        <span>Rain</span>
                        <strong id="rainState">--</strong>
                    </article>
                    <article>
                        <span>Raw</span>
                        <strong id="rawMoisture">--</strong>
                    </article>
                </div>

                <button class="water-button" id="waterNowBtn" type="button">
                    <span class="drop-icon" aria-hidden="true"></span>
                    WATER NOW
                </button>

                <p class="sync-text" id="syncText">Waiting for backend sync</p>
            </section>

            <section class="screen" id="historyScreen" data-screen="history">
                <header class="app-header compact">
                    <div>
                        <p>Recent Activity</p>
                        <h1>History</h1>
                    </div>
                </header>

                <div class="history-card">
                    <div class="mini-chart" id="miniChart" aria-label="Moisture history chart"></div>
                    <div class="log-list" id="historyList">
                        <p class="empty-state">Loading sensor history...</p>
                    </div>
                </div>
            </section>

            <section class="screen" id="settingsScreen" data-screen="settings">
                <header class="app-header compact">
                    <div>
                        <p>Device</p>
                        <h1>Settings</h1>
                    </div>
                </header>

                <div class="settings-list">
                    <article>
                        <span>Backend</span>
                        <strong>localhost:8081</strong>
                    </article>
                    <article>
                        <span>Refresh</span>
                        <strong>Every 10 seconds</strong>
                    </article>
                    <article>
                        <span>Manual Watering</span>
                        <strong>15 seconds</strong>
                    </article>
                </div>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Primary">
            <button class="nav-item active" type="button" data-target="dashboard">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
                <span>Dashboard</span>
            </button>
            <button class="nav-item" type="button" data-target="history">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 0 7 7h2a9 9 0 1 1-2.64-6.36L20 4v6h-6l2.92-2.92A6.96 6.96 0 0 0 12 5Zm1 3v4.28l3.2 1.9-1 1.72L11 13.4V8h2Z"/></svg>
                <span>History</span>
            </button>
            <button class="nav-item" type="button" data-target="settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19.43 12.98.04-.98-.04-.98 2.1-1.64-2-3.46-2.62 1.06a7.64 7.64 0 0 0-1.7-.98L14.82 3h-4l-.39 3a7.64 7.64 0 0 0-1.7.98L6.1 5.92l-2 3.46 2.1 1.64-.04.98.04.98-2.1 1.64 2 3.46 2.62-1.06c.52.4 1.09.73 1.7.98l.39 3h4l.39-3c.61-.25 1.18-.58 1.7-.98l2.62 1.06 2-3.46-2.1-1.64ZM12.82 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
                <span>Settings</span>
            </button>
        </nav>
    </div>

    <div class="watering-overlay hidden" id="wateringOverlay" role="status">
        <div class="spinner"></div>
        <strong>Watering</strong>
        <span>Sending pump command...</span>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
</body>
</html>
